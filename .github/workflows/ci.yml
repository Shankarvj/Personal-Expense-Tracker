name: Personal Expense Tracker CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Build & Automated Test Matrix
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Root & Server Dependencies
        run: |
          npm --prefix server ci || npm --prefix server install

      - name: Start In-Memory / Local Test Environment
        run: |
          node server/server.js &
          sleep 4
        env:
          PORT: 5000
          NODE_ENV: test
          JWT_SECRET: test_github_actions_super_secret_jwt_key_2026

      - name: Execute Automated Test Suite (Native node:test)
        run: |
          npm test
        env:
          TEST_API_URL: http://localhost:5000
